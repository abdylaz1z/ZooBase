name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['main.py', 'zoobase/**', 'android_src/**', 'buildozer.spec', 'requirements.txt']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache
      - name: Install Buildozer
        run: pip install buildozer==1.6.0 "cython==0.29.37" virtualenv
      - uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.android/debug.keystore
          key: android-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
          restore-keys: |
            android-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-
            android-v3-${{ runner.os }}-
      - name: Prepare pinned Android toolchain
        run: python scripts/prepare_android.py
      - name: Build APK
        env:
          NO_SQLITE: '1'
        run: buildozer -v android debug
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.android/debug.keystore
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoobase-apk
          path: bin/*.apk
          if-no-files-found: error
  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zoobase-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tests/android_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: android-artifacts
